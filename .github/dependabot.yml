version: 2

# Cooldown: ignore releases younger than a week (protects against compromised fresh versions).
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/api-codegen
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # openapi-typescript needs the TypeScript JS compiler API, which TS 7 does not ship yet.
    # This isolated tool must stay on TS 5.x until openapi-typescript supports TS 7.
    ignore:
      - dependency-name: typescript
        versions: [">=6.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
