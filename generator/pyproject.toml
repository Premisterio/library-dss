[project]
name = "libsim"
version = "0.1.0.dev0"
description = "Online library simulator with planted dependencies and ground truth for evaluating the DSS"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = ["numpy>=2.5", "tzdata>=2026.1"]

[project.scripts]
libsim = "libsim.cli:main"

[dependency-groups]
# Offline catalogue builder (Open Library + goodbooks-10k); not needed to run the simulator.
catalog = ["polars>=2.0"]
dev = ["pytest>=9", { include-group = "catalog" }]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: larger simulations that check planted signals are recoverable"]
filterwarnings = ["error"]
