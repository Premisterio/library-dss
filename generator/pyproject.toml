[project]
name = "libsim"
version = "0.1.0.dev0"
description = "Симулятор онлайн-бібліотеки із закладеними залежностями та ground truth для оцінки СППР"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = []

[project.scripts]
libsim = "libsim.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running signal-recovery tests (nightly CI)"]
