[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Migrations are numbered 0001, 0002, ... (assigned in migrations/env.py); file = <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s
# Run env.py for every `alembic revision`, so the number is assigned even without --autogenerate.
revision_environment = true
# The database URL comes from the DATABASE_URL environment variable (see migrations/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
