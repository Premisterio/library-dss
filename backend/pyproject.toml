[project]
name = "library-dss-backend"
version = "2.0.0.dev0"
description = "СППР онлайн-бібліотеки: HTTP API, база моделей, CLI і фоновий виконавець задач"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20",
    "email-validator>=2.3",
    "fastapi>=0.143",
    "httptools>=0.9",
    "orjson>=3.13",
    "polars>=2.0",
    "psycopg[binary]>=3.3",
    "pwdlib[argon2]>=0.3",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "python-multipart>=0.0.20",
    "scalar-fastapi>=1.9",
    "sqlalchemy>=2.1",
    "typer>=0.27",
    "uvicorn>=0.54",
    "uvloop>=0.23; sys_platform != 'win32'",
]

[project.scripts]
dss = "app.cli.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "libsim",
    "pytest>=9",
    "pytest-cov>=7",
    "watchfiles>=1.3",
]

[tool.uv.sources]
libsim = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs PostgreSQL reachable via DATABASE_URL"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
